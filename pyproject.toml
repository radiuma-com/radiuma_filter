[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radiuma-filter"
version = "0.1.0"
description = "Radiuma Filter execution and image-filtering package"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.20",
    "PyWavelets>=1.4",
    "Pillow>=9.0",
    "scikit-learn>=1.2",
    "pynrrd>=1.0",
    "SimpleITK>=2.2",
    "nibabel>=5.0",
    "pandas>=2.0",
    "pydicom>=2.4",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["src"]
